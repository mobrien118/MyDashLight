get_plan:
  fields:
    date:
      required: false
      example: "2026-11-03"
      selector:
        date:
    days:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 7
          mode: box

set_ride:
  fields:
    event:
      required: true
      example: abc123def456
      selector:
        text:
    side:
      required: true
      default: drop
      selector:
        select:
          translation_key: side
          options:
            - drop
            - pick
            - both
    driver:
      required: false
      example: mom
      selector:
        text:
    scope:
      required: false
      default: this
      selector:
        select:
          translation_key: scope
          options:
            - this
            - series

set_stay:
  fields:
    event:
      required: true
      example: abc123def456
      selector:
        text:
    stay:
      required: true
      default: true
      selector:
        boolean:
    scope:
      required: false
      default: this
      selector:
        select:
          translation_key: scope
          options:
            - this
            - series

set_attending:
  fields:
    event:
      required: true
      example: abc123def456
      selector:
        text:
    attending:
      required: true
      default: false
      selector:
        boolean:
    scope:
      required: false
      default: this
      selector:
        select:
          translation_key: scope
          options:
            - this
            - series

set_arrive_by:
  fields:
    event:
      required: true
      example: abc123def456
      selector:
        text:
    time:
      required: false
      example: "17:15"
      selector:
        time:
    scope:
      required: false
      default: this
      selector:
        select:
          translation_key: scope
          options:
            - this
            - series

set_take_along:
  fields:
    event:
      required: true
      example: abc123def456
      selector:
        text:
    kids:
      required: false
      example: "Ben, Cleo"
      selector:
        text:
          multiple: true
    scope:
      required: false
      default: this
      selector:
        select:
          translation_key: scope
          options:
            - this
            - series

apply_suggestion:
  fields:
    suggestion:
      required: true
      example: "2026-11-03|abc123def456|pick|dad"
      selector:
        text:

get_chores:

set_chore_done:
  fields:
    chore:
      required: true
      example: MTIzNDU2Nzg5
      selector:
        text:
    done:
      required: false
      default: true
      selector:
        boolean:
    by:
      required: false
      example: Audrey
      selector:
        text:

save_chore_template:
  fields:
    template:
      required: false
      example: 3f9a1c22b7
      selector:
        text:
    repeats:
      required: false
      example: weekly
      selector:
        select:
          translation_key: repeats
          options:
            - daily
            - weekly
            - monthly
            - school
    title:
      required: false
      example: Vacuum the stairs
      selector:
        text:
    icon:
      required: false
      example: "\U0001F9F9"
      selector:
        text:
    details:
      required: false
      selector:
        text:
          multiline: true
    who:
      required: false
      example: ["Ava", "Ben"]
      selector:
        text:
          multiple: true
    take_turns:
      required: false
      selector:
        boolean:
    days:
      required: false
      example: Thu
      selector:
        text:
    every:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 52
          mode: box
    starts:
      required: false
      selector:
        date:
    ends:
      required: false
      selector:
        date:
    points:
      required: false
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    paused:
      required: false
      selector:
        boolean:
    night_before:
      required: false
      selector:
        boolean:
    bring_only:
      required: false
      selector:
        boolean:

remove_chore_template:
  fields:
    template:
      required: true
      example: 3f9a1c22b7
      selector:
        text:

get_lunches:

set_lunch:
  fields:
    kid:
      required: true
      example: Ava
      selector:
        text:
    dates:
      required: true
      example: ["2026-11-06", "2026-11-13"]
      selector:
        text:
          multiple: true
    lunch:
      required: true
      default: bring
      selector:
        select:
          translation_key: lunch
          options:
            - bring
            - buy
            - default
