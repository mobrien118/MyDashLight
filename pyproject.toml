[project]
name = "mydashlight"
version = "0.1.0"
description = "Family Hub: a kitchen family planner built on Home Assistant and Google Calendar"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "SIM", "UP", "W"]
# Ride text uses typographic quotes and apostrophes on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components"]
