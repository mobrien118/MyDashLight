name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what Home Assistant OS runs today.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Node runs the reference planner the Python port is checked against.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r requirements_test.txt
      - name: Golden scenarios match the reference planner
        run: node tests/rides_reference/cli.js scenarios | diff - tests/rides_reference/scenarios.json
      - run: pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons are only needed for the default HACS list. The description and topics are
          # GitHub repository settings, not files, so they're checked by hand.
          ignore: brands description topics
